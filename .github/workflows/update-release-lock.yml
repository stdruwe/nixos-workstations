name: Refresh NixOS release lock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-nixos-release-lock
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and validate NixOS release bootstrap state
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Refresh tracked lon state
        shell: bash
        run: |
          set +e
          lon_output="$(nix shell nixpkgs#lon --command lon update 2>&1)"
          lon_status=$?
          set -e

          printf '%s\n' "$lon_output"

          if [ "$lon_status" -ne 0 ] && \
             ! printf '%s\n' "$lon_output" | grep -qx 'No updates available'; then
            echo "lon update failed with status $lon_status." >&2
            exit "$lon_status"
          fi

      - name: Refresh tracked FileBot source
        shell: bash
        run: |
          nix shell \
            nixpkgs#curl \
            nixpkgs#coreutils \
            nixpkgs#gnugrep \
            nixpkgs#gnused \
            --command bash \
              scripts/update-filebot-source.sh \
              pkgs/filebot-source.nix

      - name: Validate all NixOS profiles
        shell: bash
        run: |
          mkdir -p fonts/apple assets/local local

          cat > local/identity.json <<'EOF'
          {
            "hostName": "ci-host",
            "userName": "ciuser",
            "fullName": "CI User"
          }
          EOF

          base64 -d > assets/local/wallpaper.png <<'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
          EOF

          for profile in \
            thinkpad-x1-carbon-gen13 \
            hp-z2-tower-g9 \
            apple-macbook-air-8-1
          do
            if [ "$profile" = "thinkpad-x1-carbon-gen13" ]; then
              cat > local/deployment.json <<'EOF'
          {
            "networking": {
              "localSubnets": [
                "192.0.2.0/24",
                "2001:db8:1234::/64"
              ],
              "wwan": {
                "connectionId": "Example WWAN",
                "apn": "internet.example"
              }
            }
          }
          EOF
            else
              cat > local/deployment.json <<'EOF'
          {
            "networking": {
              "localSubnets": [
                "192.0.2.0/24",
                "2001:db8:1234::/64"
              ]
            }
          }
          EOF
            fi

            cat > local/profile.nix <<EOF
          { ... }:

          {
            imports = [
              ../hosts/$profile/default.nix
            ];
          }
          EOF

            echo "Evaluating $profile with refreshed release bootstrap state..."
            nix-instantiate '<nixpkgs/nixos>' \
              -A system \
              -I nixos-config="$PWD/configuration.nix" \
              >/dev/null

            if [ "$profile" = "apple-macbook-air-8-1" ]; then
              echo "Building T2 kernel configuration with refreshed nixos-hardware..."
              nix-build '<nixpkgs/nixos>' \
                -A config.boot.kernelPackages.kernel.configfile \
                --no-out-link \
                -I nixos-config="$PWD/configuration.nix" \
                >/dev/null
            fi
          done

          rm -rf local fonts/apple assets/local

      - name: Commit refreshed release state
        shell: bash
        run: |
          if git diff --quiet -- lon.nix lon.lock pkgs/filebot-source.nix; then
            echo "Tracked NixOS release bootstrap state is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lon.nix lon.lock pkgs/filebot-source.nix
          git commit -m "chore(deps): refresh NixOS release bootstrap state"
          git push origin HEAD:main
