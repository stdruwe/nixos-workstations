name: Refresh NixOS release lock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-nixos-release-lock
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and validate lon.lock
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Refresh tracked lon lock
        shell: bash
        run: |
          set +e
          lon_output="$(nix shell nixpkgs#lon --command lon update 2>&1)"
          lon_status=$?
          set -e

          printf '%s\n' "$lon_output"

          if [ "$lon_status" -ne 0 ] && [ "$lon_output" != "No updates available" ]; then
            echo "lon update failed with status $lon_status." >&2
            exit "$lon_status"
          fi

      - name: Validate all NixOS profiles
        shell: bash
        run: |
          cat > identity.json <<'EOF'
          {
            "hostName": "ci-host",
            "userName": "ciuser",
            "fullName": "CI User"
          }
          EOF

          for profile in \
            thinkpad-x1-carbon-gen13 \
            hp-z2-tower-g9 \
            apple-macbook-air-8-1
          do
            cat > profile.nix <<EOF
          { ... }:

          {
            imports = [
              ./hosts/$profile/default.nix
            ];
          }
          EOF

            echo "Evaluating $profile with refreshed lon.lock..."
            nix-instantiate '<nixpkgs/nixos>' \
              -A system \
              -I nixos-config="$PWD/configuration.nix" \
              >/dev/null
          done

          rm -f identity.json profile.nix

      - name: Commit refreshed lock
        shell: bash
        run: |
          if git diff --quiet -- lon.lock; then
            echo "Tracked lon.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lon.lock
          git commit -m "chore(deps): refresh release lon lock"
          git push origin HEAD:main
